<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background:
      radial-gradient(circle at 18% 42%, rgba(47, 111, 228, .45), transparent 46%),
      radial-gradient(circle at 92% 88%, rgba(245, 196, 0, .22), transparent 40%),
      linear-gradient(150deg, #123c8c 0%, #0a2a66 46%, #061a3d 100%);
    color: #fff;
  }
  .court {
    position: absolute;
    right: -150px;
    top: -60px;
    width: 760px;
    height: 760px;
    color: #fff;
    opacity: .07;
  }
  .frame {
    position: absolute;
    inset: 26px;
    border: 1px solid rgba(255, 255, 255, .18);
    border-radius: 22px;
  }
  .stage {
    position: relative;
    display: grid;
    grid-template-columns: 380px 1fr;
    align-items: center;
    gap: 34px;
    height: 100%;
    padding: 0 78px 0 66px;
  }
  .crest-wrap {
    position: relative;
    display: grid;
    place-items: center;
  }
  .crest-wrap::before {
    content: "";
    position: absolute;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245, 196, 0, .26), transparent 66%);
  }
  .crest { position: relative; height: 344px; width: auto; filter: drop-shadow(0 26px 44px rgba(0, 0, 0, .45)); }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #f5c400;
  }
  .eyebrow::before { content: ""; width: 34px; height: 2px; background: #f5c400; }
  h1 {
    margin: 18px 0 0;
    font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    font-size: 84px;
    line-height: .92;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .005em;
  }
  h1 em { font-style: normal; color: #f5c400; }
  .name {
    margin: 22px 0 0;
    font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    font-size: 34px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #dfe8fb;
  }
  .tags { display: flex; gap: 10px; margin-top: 26px; }
  .tags span {
    padding: 8px 15px;
    border: 1px solid rgba(255, 255, 255, .3);
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: .04em;
    color: #eaf0fd;
  }
  .tags span.gold { background: #f5c400; border-color: #f5c400; color: #061a3d; }
</style>
</head>
