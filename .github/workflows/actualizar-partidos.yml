name: Actualizar partidos

# Lee la FAV cada 5 minutos y también al publicar cambios en la web.
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-partidos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer partidos de la FAV y regenerar la web
        run: python3 tools/actualizar-partidos.py

      - name: Guardar cambios si los hay
        run: |
          git config user.name "actualizar-partidos"
          git config user.email "actualizar-partidos@users.noreply.github.com"
          git add index.html ABRIR-WEB-CLUB-VOLEIBOL.html datos.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualiza partidos del club desde la FAV"
            git push
          fi
